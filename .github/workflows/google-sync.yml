name: 'Sync Fleet iPhones to Google (Context-Aware Access test)'

# Lab for the "Conditional access: Google" guide. GitHub runs schedules best effort (the Duo lab saw 2 runs in 11 hours with
# a 5-minute cron), so, like duo-sync-loop.yml, GitHub starts a run every 30 minutes and each run syncs every 5 minutes for about
# 28 minutes. Bills about 28 minutes per run: free in a public repository. Manual runs sync once (dry run by default).
# Secrets (separate from the GitOps workflow's FLEET_API_TOKEN): GOOGLE_SYNC_FLEET_API_TOKEN (API-only Observer user),
# GOOGLE_CREDENTIALS (service account JSON key), GOOGLE_ADMIN_EMAIL (admin the service account acts as), GOOGLE_CUSTOMER_ID (starts with C), FLEET_URL.
on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the changes"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      # The guide's google-github-actions/auth step with access_token_subject failed here with
      # "failed to generate Google Cloud Domain Wide Delegation OAuth 2.0 Access Token: HTTP 400 invalid_request" (run 37921809581).
      # Sign the delegation JWT with the key instead (same as tools/google-token.sh in the lab). Needs only openssl and jq.
      - id: google
        name: Get a Google access token (domain-wide delegation)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
        run: |
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          claims=$(jq -nc --arg iss "$(jq -r .client_email <<<"$GOOGLE_CREDENTIALS")" --arg sub "$GOOGLE_ADMIN_EMAIL" --argjson now "$now" \
            '{iss: $iss, sub: $sub, scope: "https://www.googleapis.com/auth/cloud-identity.devices", aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 3600)}' | b64)
          sig=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign <(jq -r .private_key <<<"$GOOGLE_CREDENTIALS") | b64)
          token=$(curl -fsS https://oauth2.googleapis.com/token --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode "assertion=$header.$claims.$sig" | jq -er .access_token)
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"
      - name: Sync
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN: ${{ secrets.GOOGLE_SYNC_FLEET_API_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_CUSTOMER_ID: ${{ secrets.GOOGLE_CUSTOMER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          sync=fleets/ios-google-lab/google-sync/sync-fleet-hosts-to-google.sh
          # Public repository: the script prints "<Google device> (<email>/iphone): A -> B" on each change. Hide the email domain
          # and the Google device and user IDs in the log. The exit code is the script's, not sed's.
          mask() { sed -E 's/@[A-Za-z0-9.-]+\.[A-Za-z]+/@…/g; s#devices/[A-Za-z0-9_-]+#devices/…#g; s#deviceUsers/[A-Za-z0-9_-]+#deviceUsers/…#g'; }
          if [ "${{ github.event_name }}" != schedule ]; then bash "$sync" 2>&1 | mask; exit "${PIPESTATUS[0]}"; fi
          # The token lasts an hour, so one token covers the whole loop. A failed sync doesn't stop the loop; the job fails at the end.
          rc=0
          for i in 1 2 3 4 5 6; do
            echo "== sync $i at $(date -u +%H:%M:%SZ)"
            bash "$sync" 2>&1 | mask; [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
            [ "$i" -lt 6 ] && sleep 290
          done
          exit $rc
