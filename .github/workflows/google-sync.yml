name: 'Sync Fleet iPhones to Google (Context-Aware Access test)'

# Lab for the "Conditional access: Google" guide (fleetdm/fleet#55107): sync Fleet's managed iPhones and iPads to Google client
# states every 5 minutes. A run takes about 15 seconds. Manual runs are a dry run by default.
# Schedule: 5 minutes is GitHub's shortest interval. GitHub runs schedules from the default branch and can delay or drop them when
# busy ("High load times include the start of every hour"), so this one starts at minute 2, not 0. In this repo GitHub has started
# scheduled runs hours late (see testing/google-ca-55107), so check the run history. Docs:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
# The script gets its own Google token from the service account key (the guide's google-github-actions/auth step with
# access_token_subject failed here: HTTP 400 invalid_request, run 37921809581).
# Secrets (separate from the GitOps workflow's FLEET_API_TOKEN): GOOGLE_SYNC_FLEET_API_TOKEN (API-only Observer user, List hosts
# only), GOOGLE_CREDENTIALS (service account JSON key), GOOGLE_ADMIN_EMAIL (admin the service account acts as), GOOGLE_CUSTOMER_ID
# (starts with C), FLEET_URL.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the changes"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Sync
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN: ${{ secrets.GOOGLE_SYNC_FLEET_API_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_CUSTOMER_ID: ${{ secrets.GOOGLE_CUSTOMER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        # Public repository: hide email domains and Google device and user IDs in the log. The exit code is the script's.
        run: |
          bash fleets/ios-google-lab/google-sync/sync-fleet-hosts-to-google.sh 2>&1 |
            sed -E 's/@[A-Za-z0-9.-]+\.[A-Za-z]+/@…/g; s#(devices|deviceUsers)/[A-Za-z0-9_%-]+#\1/…#g'
          exit "${PIPESTATUS[0]}"
