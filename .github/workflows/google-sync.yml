name: 'Sync Fleet iPhones to Google (Context-Aware Access test)'

# Lab for the "Conditional access: Google" guide (customer-antonella request). Starts as manual only (workflow_dispatch).
# To test the guide's schedule (test G-12), uncomment the schedule below. GitHub runs schedules best effort; the Duo lab saw
# 2 runs in 11 hours, and a private repo on the free plan has 2,000 minutes a month.
# Secrets (separate from the GitOps workflow's FLEET_API_TOKEN): GOOGLE_SYNC_FLEET_API_TOKEN (API-only Observer user),
# GOOGLE_CREDENTIALS (service account JSON key), GOOGLE_ADMIN_EMAIL (admin the service account acts as), GOOGLE_CUSTOMER_ID (starts with C), FLEET_URL.
on:
  # schedule:
  #   - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the changes"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-identity.devices
          access_token_subject: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
      - name: Sync
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN: ${{ secrets.GOOGLE_SYNC_FLEET_API_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_CUSTOMER_ID: ${{ secrets.GOOGLE_CUSTOMER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: bash fleets/ios-google-lab/google-sync/sync-fleet-hosts-to-google.sh
