name: 'Apply latest configuration to Fleet'

on:
  push:
    branches:
      - main
    # Notes, test evidence and the Duo sync don't change Fleet, so they don't need a live apply.
    paths-ignore:
      - 'testing/**'
      - 'fleets/*/**'
      - '**.md'
      - '.github/workflows/duo-sync*.yml'
      - '.github/workflows/google-sync*.yml'
  pull_request:
  workflow_dispatch: # allows manual triggering
  schedule:
  - cron: '0 6 * * *' # Nightly 6AM UTC

# Prevent concurrent runs of this workflow.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Limit permissions of GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  fleet-gitops:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Test the new image before moving.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6

      - name: Apply latest configuration to Fleet
        uses: ./.github/gitops-action
        with:
          # Run GitOps in dry-run mode for pull requests.
          dry-run-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        # Add the environment variables below to the repository secrets.
        # In addition, specify or add secrets for all the environment variables that are mentioned in the global/team YAML files.
        env:
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}
          FLEET_PERSONAL_MOBILE_DEVICES_ENROLL_SECRET: ${{ secrets.FLEET_PERSONAL_MOBILE_DEVICES_ENROLL_SECRET }}
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_WORKSTATIONS_ENROLL_SECRET: ${{ secrets.FLEET_WORKSTATIONS_ENROLL_SECRET }}
          FLEET_GLOBAL_ENROLL_SECRET: ${{ secrets.FLEET_GLOBAL_ENROLL_SECRET }}
          FLEET_PING_DUO_LAB_ENROLL_SECRET: ${{ secrets.FLEET_PING_DUO_LAB_ENROLL_SECRET }}
          FLEET_LINUX_LUKS_LAB_ENROLL_SECRET: ${{ secrets.FLEET_LINUX_LUKS_LAB_ENROLL_SECRET }}
          FLEET_IOS_GOOGLE_LAB_ENROLL_SECRET: ${{ secrets.FLEET_IOS_GOOGLE_LAB_ENROLL_SECRET }}
          FLEET_LAB_CA_SCEP_CHALLENGE: ${{ secrets.FLEET_LAB_CA_SCEP_CHALLENGE }}
          FLEET_SECRET_LAB_CA_THUMBPRINT: ${{ secrets.FLEET_SECRET_LAB_CA_THUMBPRINT }}
          
          
