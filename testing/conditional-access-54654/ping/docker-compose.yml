# PingFederate for the lab. Run from this directory:
#   docker compose --env-file ../.env up -d
# Admin console https://localhost:9999/pingfederate/app, Admin API https://localhost:9999/pf-admin-api/v1
# Runtime 9031. Secondary HTTPS (mutual TLS for client certs) 9032.
services:
  pingfederate:
    image: pingidentity/pingfederate:2609-13.1.3
    container_name: pingfederate
    restart: unless-stopped
    ports:
      - "9999:9999"
      - "9031:9031"
      - "9032:9032"
    environment:
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PING_IDENTITY_DEVOPS_USER: "${PING_IDENTITY_DEVOPS_USER}"
      PING_IDENTITY_DEVOPS_KEY: "${PING_IDENTITY_DEVOPS_KEY}"
      PING_IDENTITY_PASSWORD: "${PING_ADMIN_PASSWORD}"
      SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
      SERVER_PROFILE_PATH: getting-started/pingfederate
      PF_RUN_PF_SECONDARY_HTTPS_PORT: "9032"
    volumes:
      - pf_out:/opt/out
volumes:
  pf_out:
