# Mock IdP for Fleet end user authentication in the Windows Reset Lab. Same image Fleet uses for local development.
# The signing key and users are generated by setup.sh into ../private/idp/, so the key baked into the public image
# is never trusted by the lab Fleet.
services:
  idp:
    image: fleetdm/docker-idp:latest
    platform: linux/amd64
    container_name: ppkg-wipe-idp
    restart: unless-stopped
    ports:
      # All interfaces: the UTM bridge (192.168.64.1) exists only while a VM runs, so Docker can't bind to it ahead of time.
      - "9080:8080"
    volumes:
      - ./sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
      - ../private/idp/users.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ../private/idp/server.crt:/var/www/simplesamlphp/cert/server.crt:ro
      - ../private/idp/server.pem:/var/www/simplesamlphp/cert/server.pem:ro
