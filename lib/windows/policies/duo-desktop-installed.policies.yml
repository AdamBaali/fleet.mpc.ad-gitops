- name: Duo Desktop installed (Windows)
  description: Duo Desktop reports device health to Duo Trusted Endpoints.
  resolution: Fleet installs Duo Desktop when this policy fails.
  platform: windows
  query: |
    SELECT 1 FROM programs WHERE name = 'Duo Desktop' AND publisher = 'Duo Security';
  install_software:
    fleet_maintained_app_slug: duo-desktop/windows
