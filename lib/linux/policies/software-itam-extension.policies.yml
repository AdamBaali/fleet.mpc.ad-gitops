- name: software_itam osquery extension loaded (linux)
  query: |
    SELECT 1 FROM osquery_registry
    WHERE registry = 'table' AND name = 'software_itam' AND active = 1;
  description: |
    Passes when the software_itam extension is loaded, so the "ITAM software
    (extension)" report can read it (fleetdm/fleet#38864).

    The query checks osquery_registry, which always exists, so it never errors.
    Querying software_itam directly would error when the extension is missing,
    which Fleet shows as neither passing nor failing and would not run the installer.

    Failing hosts run install-software-itam-extension.sh. It downloads a binary
    pinned by commit and SHA-256, adds it to osquery's default extensions.load
    and restarts fleetd 30 seconds later. Fleet caps run_script retries at 3 per failure.
  resolution: |
    install-software-itam-extension.sh installs the extension. If a host stays
    failing, read the script output in Fleet > Hosts > Activity and confirm the
    host can reach raw.githubusercontent.com.
  platform: linux
  run_script:
    path: ../scripts/install-software-itam-extension.sh
