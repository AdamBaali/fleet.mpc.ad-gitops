# One row per app or package from the software_itam extension (fleetdm/fleet#38864).
# It joins install date, publisher and first seen on the host, so the exporter
# reads one report instead of the per-OS native ones. Hosts without the
# extension return no rows; the software-itam-extension policy installs it.

- name: ITAM software (extension)
  automations_enabled: false
  description: |
    install_date_source and publisher_source say where each value came from.
    install_date_candidates lists every source found, for comparing them in tests.
    first_seen is when the extension first saw the item on this host.
  discard_data: false
  interval: 3600
  logging: snapshot
  observer_can_run: false
  platform: darwin,linux,windows
  query: |
    SELECT source, name, version, identifier, path, arch, publisher, publisher_source,
           install_date, install_date_source, install_date_candidates, first_seen
    FROM software_itam;
