- name: Shadow AI - VS Code AI extensions (all platforms)
  query: |
    SELECT
      u.username,
      e.vscode_edition,
      e.name,
      e.publisher,
      e.publisher_id,
      e.version,
      e.path
    FROM users u
    JOIN vscode_extensions e USING (uid)
    WHERE e.publisher_id IN (
      'github',
      'codeium',
      'tabnine',
      'continue',
      'amazonwebservices',
      'sourcegraph',
      'pieces-app',
      'anysphere',
      'augment',
      'rooveterinaryinc',
      'supermaven',
      'saoudrizwan',
      'kodu-ai',
      'blackboxapp'
    )
    OR e.name LIKE '%Copilot%'
    OR e.name LIKE '%Codeium%'
    OR e.name LIKE '%Tabnine%'
    OR e.name LIKE '%Continue%'
    OR e.name LIKE '%Amazon Q%'
    OR e.name LIKE '%Pieces%'
    OR e.name LIKE '%Augment%'
    OR e.name LIKE '%Supermaven%'
    OR e.name LIKE '%Cody%'
    OR e.name LIKE '%Kite%'
    OR e.name LIKE '%Roo%'
    OR e.name LIKE '%Cline%'
    ORDER BY u.username, e.vscode_edition, e.name;
  description: |
    AI coding extensions installed in any VS Code-compatible editor on this host.

    Uses the native vscode_extensions osquery table, which covers all IDE editions:
      vscode     Visual Studio Code
      cursor     Cursor AI code editor
      windsurf   Windsurf AI code editor (Codeium/Exafunction)
      vscodium   VSCodium (open-source VS Code build)
      trae       Trae AI IDE (ByteDance)

    The vscode_edition column identifies which editor the extension is installed in,
    so Cursor and Windsurf installs are visible even without separate queries.

    Publisher IDs matched:
      github                     GitHub Copilot + Copilot Chat
      codeium                    Windsurf Plugin (formerly Codeium)
      tabnine                    Tabnine
      continue                   Continue.dev
      amazonwebservices          Amazon Q Developer
      sourcegraph                Sourcegraph Cody
      pieces-app                 Pieces for Developers
      anysphere                  Cursor AI helper extensions
      augment                    Augment Code
      rooveterinaryinc           Roo Code (formerly Roo-Cline)
      supermaven                 Supermaven AI autocomplete
      saoudrizwan                Cline (original, by saoudrizwan)
      kodu-ai                    Kodu AI
      blackboxapp                Blackbox AI

    Name patterns catch additional tools not covered by publisher matching.

    No rows means no AI extensions are installed in any supported editor.
  platform:
