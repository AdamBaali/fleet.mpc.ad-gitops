        ELSE 'managed: forceBypassScreenCaptureAlert = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'forceBypassScreenCaptureAlert' AND username = '') mp
    UNION ALL
    SELECT 'management.gatekeeper-configuration' AS check_id, 'Security' AS category, 'Gatekeeper Configuration' AS test,
