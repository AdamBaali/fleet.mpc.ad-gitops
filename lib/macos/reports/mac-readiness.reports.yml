# Mac deployment readiness reports.
# Generated. Don't edit by hand. The generator is kept in testing/mac-readiness/private/.

- name: Mac readiness - Computer and network (macOS)
  automations_enabled: false
  description: |
    Computer and local network details: model, macOS version, Secure Enclave, DNS,
    IP address, hosts file, proxy, and Wi-Fi.
    Every report returns check_id, category, test, result (PASS, WARN, FAIL, INFO),
    and value. See testing/mac-readiness/.
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: darwin
  query: |
    SELECT 'computer.computer-name' AS check_id, 'Computer Information' AS category, 'Computer Name' AS test,
      'INFO' AS result, computer_name AS value
    FROM system_info
    UNION ALL
    SELECT 'computer.macos-version-number' AS check_id, 'Computer Information' AS category, 'macOS Version Number' AS test,
      'INFO' AS result, version || ' (' || build || ')' AS value
    FROM os_version
    UNION ALL
    SELECT 'computer.mac-model' AS check_id, 'Computer Information' AS category, 'Mac Model' AS test,
      'INFO' AS result, hardware_model AS value
    FROM system_info
    UNION ALL
    SELECT 'computer.secure-enclave' AS check_id, 'Computer Information' AS category, 'Secure Enclave' AS test,
      CASE
        WHEN o.arch = 'arm64' THEN 'PASS'
        WHEN i.v LIKE '%T2%' THEN 'PASS'
        ELSE 'WARN'
      END AS result,
      CASE
        WHEN o.arch = 'arm64' THEN 'Apple silicon'
        WHEN i.v IS NULL THEN 'no Secure Enclave found'
        ELSE i.v
      END AS value
    FROM os_version o, (SELECT MAX(coprocessor_version) AS v FROM ibridge_info) i
    UNION ALL
    SELECT 'network.public-dns-domain' AS check_id, 'DNS' AS category, 'Public DNS Domain' AS test,
      'INFO' AS result, hostname AS value
    FROM system_info
    UNION ALL
    SELECT 'network.primary-search-domain' AS check_id, 'DNS' AS category, 'Primary Search Domain' AS test,
      'INFO' AS result,
      COALESCE((SELECT address FROM dns_resolvers WHERE type = 'search' ORDER BY id LIMIT 1), 'none') AS value
    UNION ALL
    SELECT 'network.supplemental-match-domains' AS check_id, 'DNS' AS category, 'Supplemental Match Domains' AS test,
      'INFO' AS result,
      COALESCE((SELECT GROUP_CONCAT(address, ', ') FROM dns_resolvers WHERE type = 'search'), 'none') AS value
    UNION ALL
    SELECT 'network.dns-servers' AS check_id, 'DNS' AS category, 'DNS Servers' AS test,
      'INFO' AS result,
      COALESCE((SELECT GROUP_CONCAT(address, ', ') FROM dns_resolvers WHERE type = 'nameserver'), 'none') AS value
    UNION ALL
    SELECT 'network.private-ip-address' AS check_id, 'Local' AS category, 'Private IP Address' AS test,
      CASE WHEN ip.n = 0 THEN 'FAIL' WHEN ip.cgnat > 0 THEN 'WARN' ELSE 'PASS' END AS result,
      CASE WHEN ip.n = 0 THEN 'no IPv4 address on the default route' ELSE ip.addrs END AS value
    FROM (
      SELECT COUNT(*) AS n, GROUP_CONCAT(interface || ' ' || address, ', ') AS addrs,
             SUM(address GLOB '100.6[4-9].*' OR address GLOB '100.[7-9][0-9].*'
                 OR address GLOB '100.1[01][0-9].*' OR address GLOB '100.12[0-7].*') AS cgnat
      FROM interface_addresses
      WHERE interface IN (SELECT interface FROM routes WHERE destination = '0.0.0.0' AND netmask = 0)
        AND address LIKE '%.%' AND address NOT LIKE '169.254.%'
    ) ip
    UNION ALL
    SELECT 'network.active-network-interfaces' AS check_id, 'Local' AS category, 'Active Network Interfaces' AS test,
      'INFO' AS result,
      COALESCE((SELECT GROUP_CONCAT(DISTINCT interface) FROM interface_addresses
                WHERE address LIKE '%.%' AND interface != 'lo0' AND address NOT LIKE '169.254.%'), 'none') AS value
    UNION ALL
    SELECT 'network.host-file-status' AS check_id, 'Local' AS category, 'Host File Status' AS test,
      CASE WHEN h.sha256 IS NULL THEN 'FAIL' WHEN h.sha256 = 'c7dd0e2ed261ce76d76f852596c5b54026b9a894fa481381ffd399b556c0e2da' THEN 'PASS' ELSE 'FAIL' END AS result,
      CASE
        WHEN h.sha256 IS NULL THEN 'hosts file not found'
        WHEN h.sha256 = 'c7dd0e2ed261ce76d76f852596c5b54026b9a894fa481381ffd399b556c0e2da' THEN 'unmodified'
        ELSE 'modified: ' || COALESCE((SELECT GROUP_CONCAT(address || ' ' || hostnames, '; ') FROM etc_hosts
                                      WHERE hostnames NOT IN ('localhost', 'broadcasthost')), 'comments or spacing only')
      END AS value
    FROM (SELECT (SELECT sha256 FROM hash WHERE path = '/private/etc/hosts') AS sha256) h
    UNION ALL
    SELECT 'network.proxy-information' AS check_id, 'Local' AS category, 'Proxy Information' AS test,
      'INFO' AS result,
      COALESCE((SELECT GROUP_CONCAT(DISTINCT REPLACE(SUBSTR(subkey, INSTR(subkey, '/Proxies/') + 9), 'Enable', ''))
                FROM plist
                WHERE path = '/Library/Preferences/SystemConfiguration/preferences.plist'
                  AND key = 'NetworkServices' AND subkey LIKE '%/Proxies/%Enable' AND value = '1'), 'No proxy') AS value
    UNION ALL
    SELECT 'network.wi-fi-details' AS check_id, 'Local' AS category, 'Wi-Fi Details' AS test,
      'INFO' AS result,
      COALESCE((SELECT COALESCE(NULLIF(network_name, ''), 'name hidden') || ', ' || security_type
                       || ', channel ' || channel || ', RSSI ' || rssi
                FROM wifi_status LIMIT 1), 'not connected to Wi-Fi') AS value;

- name: Mac readiness - Management and identity (macOS)
  automations_enabled: false
  description: |
    Device management enrollment, security settings, Apple Intelligence and software
    update restrictions, and directory binding. Managed settings come from managed_policies.
    Every report returns check_id, category, test, result (PASS, WARN, FAIL, INFO),
    and value. See testing/mac-readiness/.
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: darwin
  query: |
    SELECT 'management.writing-tools-configuration' AS check_id, 'Apple Intelligence' AS category, 'Writing Tools Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
        WHEN mp.v IN ('0', 'false') THEN 'INFO'
        ELSE 'INFO'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: allowWritingTools = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowWritingTools' AND username = '') mp
    UNION ALL
    SELECT 'management.image-playground-configuration' AS check_id, 'Apple Intelligence' AS category, 'Image Playground Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
        WHEN mp.v IN ('0', 'false') THEN 'INFO'
        ELSE 'INFO'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: allowImagePlayground = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowImagePlayground' AND username = '') mp
    UNION ALL
