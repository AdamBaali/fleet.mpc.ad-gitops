        ELSE 'managed: allowNotesTranscriptionSummary = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowNotesTranscriptionSummary' AND username = '') mp
    UNION ALL
    SELECT 'management.allow-transcription-in-notes' AS check_id, 'Apple Intelligence' AS category, 'Allow Transcription in Notes' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
        WHEN mp.v IN ('0', 'false') THEN 'INFO'
        ELSE 'INFO'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
