          FROM managed_policies WHERE domain IN ('com.apple.dt.Xcode') AND name = 'IDEProhibitOnDeviceModelInteraction' AND username = '') mp
    UNION ALL
    SELECT 'management.swift-assist-configuration' AS check_id, 'Apple Intelligence' AS category, 'Swift Assist Configuration' AS test,
