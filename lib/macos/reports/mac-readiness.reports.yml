    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowMailSummary' AND username = '') mp
    UNION ALL
    SELECT 'management.code-completion-configuration' AS check_id, 'Apple Intelligence' AS category, 'Code Completion Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
