      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowRapidSecurityResponseInstallation' AND username = '') mp
    UNION ALL
    SELECT 'management.rapid-security-response-removal-status' AS check_id, 'Management' AS category, 'Rapid Security Response Removal Status' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
        WHEN mp.v IN ('0', 'false') THEN 'INFO'
        ELSE 'INFO'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: allowRapidSecurityResponseRemoval = ' || mp.v
