        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: allowUniversalControl = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowUniversalControl' AND username = '') mp
    UNION ALL
    SELECT 'management.ui-configuration-profile-installation' AS check_id, 'Management' AS category, 'UI Configuration Profile Installation' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
        WHEN mp.n > 1 THEN 'INFO'
        WHEN mp.v IN ('0', 'false') THEN 'INFO'
        ELSE 'INFO'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: allowUIConfigurationProfileInstallation = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowUIConfigurationProfileInstallation' AND username = '') mp
    UNION ALL
    SELECT 'management.system-settings-configuration-deprecated' AS check_id, 'Management' AS category, 'System Settings Configuration (Deprecated)' AS test,
      'INFO' AS result,
      CASE WHEN s.n = 0 THEN 'System Settings are unmanaged' ELSE 'managed: ' || s.keys END AS value
    FROM (SELECT COUNT(*) AS n, GROUP_CONCAT(name, ', ') AS keys FROM managed_policies
          WHERE domain = 'com.apple.systempreferences') s
    UNION ALL
    SELECT 'management.network-time-server-configuration' AS check_id, 'Management' AS category, 'Network Time Server Configuration' AS test,
      CASE WHEN t.n = 0 OR t.n > 1 THEN 'FAIL' WHEN t.s = 'time.apple.com' THEN 'PASS' ELSE 'WARN' END AS result,
      CASE WHEN t.n = 0 THEN 'The network time server couldn''t be determined' ELSE t.servers END AS value
    FROM (SELECT COUNT(*) AS n,
                 MAX(TRIM(SUBSTR(TRIM(line), 8))) AS s,
                 GROUP_CONCAT(TRIM(SUBSTR(TRIM(line), 8)), ', ') AS servers
          FROM file_lines WHERE path = '/private/etc/ntp.conf' AND TRIM(line) LIKE 'server %') t
    UNION ALL
    SELECT 'management.firewall-configuration' AS check_id, 'Security' AS category, 'Firewall Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'WARN'
        WHEN mp.n > 1 THEN 'WARN'
        WHEN mp.v IN ('0', 'false') THEN 'WARN'
        ELSE 'PASS'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: EnableFirewall = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.security.firewall') AND name = 'EnableFirewall' AND username = '') mp
    UNION ALL
    SELECT 'management.screen-saver-ask-for-password-configuration' AS check_id, 'Security' AS category, 'Screen Saver Ask For Password Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'FAIL'
        WHEN mp.n > 1 THEN 'WARN'
        WHEN mp.v IN ('0', 'false') THEN 'WARN'
        ELSE 'PASS'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: askForPasswordDelay = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.screensaver') AND name = 'askForPasswordDelay' AND username = '') mp
    UNION ALL
    SELECT 'management.secure-boot-status' AS check_id, 'Security' AS category, 'Secure Boot Status' AS test,
      CASE WHEN b.description = 'Full Security' OR b.secure_mode = 1 THEN 'PASS' ELSE 'FAIL' END AS result,
      COALESCE(NULLIF(b.description, ''), 'secure_mode ' || b.secure_mode, 'Unknown secure boot status') AS value
    FROM (SELECT (SELECT description FROM secureboot) AS description,
                 (SELECT secure_mode FROM secureboot) AS secure_mode) b
    UNION ALL
    SELECT 'management.screen-saver-idle-time-configuration' AS check_id, 'Security' AS category, 'Screen Saver Idle Time Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'WARN'
        WHEN mp.n > 1 THEN 'WARN'
        WHEN mp.v IN ('0', 'false') THEN 'WARN'
        ELSE 'PASS'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: idleTime = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.screensaver', 'com.apple.screensaver.user') AND name = 'idleTime') mp
    UNION ALL
    SELECT 'management.secure-token' AS check_id, 'Security' AS category, 'Secure Token' AS test,
      CASE WHEN t.n = 0 THEN 'PASS' ELSE 'FAIL' END AS result,
      CASE WHEN t.n = 0 THEN 'All users have a secure token' ELSE 'Users without secure tokens: ' || t.users END AS value
    FROM (SELECT COUNT(*) AS n, GROUP_CONCAT(u.username, ', ') AS users
          FROM users u
          CROSS JOIN dscl d ON d.command = 'read' AND d.path = '/Users/' || u.username AND d.key = 'AuthenticationAuthority'
          WHERE u.uid >= 500 AND u.shell NOT LIKE '%/false' AND u.username NOT LIKE '\_%' ESCAPE '\'
            AND d.value NOT LIKE '%;SecureToken;%') t
    UNION ALL
    SELECT 'management.screen-saver-lock-configuration' AS check_id, 'Security' AS category, 'Screen Saver Lock Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'WARN'
        WHEN mp.n > 1 THEN 'WARN'
        WHEN mp.v IN ('0', 'false') THEN 'WARN'
        ELSE 'PASS'
      END AS result,
      CASE
        WHEN mp.n = 0 THEN 'unmanaged'
        WHEN mp.n > 1 THEN 'multiple values: ' || mp.vals
        ELSE 'managed: askForPassword = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.screensaver') AND name = 'askForPassword' AND username = '') mp
    UNION ALL
    SELECT 'management.bypass-screen-capture-alert-configuration' AS check_id, 'Security' AS category, 'Bypass Screen Capture Alert Configuration' AS test,
      CASE
        WHEN mp.n = 0 THEN 'INFO'
