    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.systempolicy.managed') AND name = 'DisableOverride' AND username = '') mp
    UNION ALL
    SELECT 'management.authorization-database-modifications' AS check_id, 'Security' AS category, 'Authorization Database Modifications' AS test,
