        ('apple-services.appldnld-apple-com-80', 'Software Updates', 'appldnld.apple.com (port 80)', 'http://appldnld.apple.com/'),
        ('apple-services.updates-http-cdn-apple-com-80', 'Software Updates', 'updates-http.cdn-apple.com (port 80)', 'http://updates-http.cdn-apple.com/'),
        ('apple-services.itunes-com-80', 'Carrier Updates', 'itunes.com (port 80)', 'http://itunes.com/'),
        ('apple-services.appldnld-apple-com-edgesuite-net-80', 'Carrier Updates', 'appldnld.apple.com.edgesuite.net (port 80)', 'http://appldnld.apple.com.edgesuite.net/'),
        ('apple-services.suconfig-apple-com-80', 'Content Caching', 'suconfig.apple.com (port 80)', 'http://suconfig.apple.com/'),
        ('apple-services.crl-apple-com-80', 'Certificate Validation', 'crl.apple.com (port 80)', 'http://crl.apple.com/'),
        ('apple-services.crl3-digicert-com-80', 'Certificate Validation', 'crl3.digicert.com (port 80)', 'http://crl3.digicert.com/'),
        ('apple-services.crl4-digicert-com-80', 'Certificate Validation', 'crl4.digicert.com (port 80)', 'http://crl4.digicert.com/'),
        ('apple-services.ocsp-apple-com-80', 'Certificate Validation', 'ocsp.apple.com (port 80)', 'http://ocsp.apple.com/'),
        ('apple-services.ocsp-digicert-com-80', 'Certificate Validation', 'ocsp.digicert.com (port 80)', 'http://ocsp.digicert.com/')
      )
    ),
    responses AS (
      SELECT url, CAST(response_code AS INTEGER) AS code FROM curl WHERE url IN ('http://appldnld.apple.com.edgesuite.net/', 'http://appldnld.apple.com/', 'http://crl.apple.com/', 'http://crl.comodoca.com/', 'http://crl.rootca1.amazontrust.com/', 'http://crl3.digicert.com/', 'http://crl4.digicert.com/', 'http://crt.rootca1.amazontrust.com/', 'http://init-p01st.push.apple.com/', 'http://itunes.com/', 'http://ocsp.apple.com/', 'http://ocsp.comodoca.com/', 'http://ocsp.digicert.com/', 'http://ocsp.rootca1.amazontrust.com/', 'http://ocsp.rootca2.amazontrust.com/', 'http://ocsp.rootca3.amazontrust.com/', 'http://ocsp.rootca4.amazontrust.com/', 'http://ocsp.rootg2.amazontrust.com/', 'http://suconfig.apple.com/', 'http://updates-http.cdn-apple.com/')
    )
    SELECT t.check_id, t.category, t.test,
      CASE
        WHEN c.hostname IS NULL THEN 'FAIL'
        WHEN c.tls_version NOT IN ('TLSv1.2', 'TLSv1.3') THEN 'WARN'
        ELSE 'PASS'
      END AS result,
      CASE
        WHEN c.hostname IS NULL THEN t.hostname || ': no TLS connection'
        ELSE t.hostname || ': ' || c.tls_version || ', issuer ' || COALESCE(c.issuer_organization, 'unknown')
      END AS value
    FROM tls_targets t LEFT JOIN certs c ON c.hostname = t.hostname
    UNION ALL
    SELECT t.check_id, t.category, t.test,
      CASE WHEN COALESCE(r.code, 0) > 0 THEN 'PASS' ELSE 'FAIL' END AS result,
      CASE WHEN COALESCE(r.code, 0) > 0 THEN t.url || ': HTTP ' || r.code ELSE t.url || ': no response' END AS value
    FROM http_targets t LEFT JOIN responses r ON r.url = t.url;

- name: Mac readiness - Push notifications (macOS)
  automations_enabled: false
  description: |
    A TLS handshake to each APNs courier host on ports 443 and 5223 (102 checks),
    and an HTTPS interception check that fails when the courier certificate isn't issued by Apple.
    Every report returns check_id, category, test, result (PASS, WARN, FAIL, INFO),
    and value. See testing/mac-readiness/.
