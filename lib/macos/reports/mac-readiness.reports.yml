          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowNotesTranscription' AND username = '') mp
    UNION ALL
    SELECT 'management.allow-apple-intelligence-reports' AS check_id, 'Apple Intelligence' AS category, 'Allow Apple Intelligence Reports' AS test,
      CASE
