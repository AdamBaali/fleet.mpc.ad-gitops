        ('apple-services.ocsp-rootca2-amazontrust-com-80', 'Claris Connect', 'ocsp.rootca2.amazontrust.com (port 80)', 'http://ocsp.rootca2.amazontrust.com/'),
        ('apple-services.ocsp-rootca3-amazontrust-com-80', 'Claris Connect', 'ocsp.rootca3.amazontrust.com (port 80)', 'http://ocsp.rootca3.amazontrust.com/'),
        ('apple-services.ocsp-rootca4-amazontrust-com-80', 'Claris Connect', 'ocsp.rootca4.amazontrust.com (port 80)', 'http://ocsp.rootca4.amazontrust.com/'),
        ('apple-services.ocsp-rootg2-amazontrust-com-80', 'Claris Connect', 'ocsp.rootg2.amazontrust.com (port 80)', 'http://ocsp.rootg2.amazontrust.com/'),
