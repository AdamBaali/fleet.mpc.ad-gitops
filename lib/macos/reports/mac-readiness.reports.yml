- name: Mac readiness - Applications (macOS)
  automations_enabled: false
  description: |
    Unsigned and Intel-only apps in /Applications, kernel and system extensions, and
    background items. Reads every app's signature, so it runs once a day.
    Every report returns check_id, category, test, result (PASS, WARN, FAIL, INFO),
    and value. See testing/mac-readiness/.
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: darwin
  query: |
    SELECT 'apps.third-party-kexts' AS check_id, 'Application Information' AS category, 'Third-Party KEXTs' AS test,
      CASE WHEN k.n = 0 THEN 'PASS' ELSE 'WARN' END AS result,
      CASE WHEN k.n = 0 THEN 'No third-party kernel extensions found' ELSE k.names END AS value
    FROM (SELECT COUNT(*) AS n, GROUP_CONCAT(name || ' ' || version, ', ') AS names FROM kernel_extensions
          WHERE name NOT LIKE 'com.apple.%' AND name != '__kernel__') k
    UNION ALL
    SELECT 'apps.non-universal-applications' AS check_id, 'Application Information' AS category, 'Non-Universal Applications' AS test,
      CASE WHEN i.n = 0 THEN 'PASS' WHEN (SELECT arch FROM os_version) = 'arm64' THEN 'FAIL' ELSE 'INFO' END AS result,
      CASE WHEN i.n = 0 THEN 'No non-universal applications found' ELSE i.apps END AS value
    FROM (SELECT COUNT(*) AS n, GROUP_CONCAT(path, ', ') AS apps FROM (
            SELECT a.path FROM apps a
            CROSS JOIN signature s ON s.path = a.path AND s.hash_resources = 0 AND s.hash_executable = 0
            WHERE a.path LIKE '/Applications/%'
            GROUP BY a.path
            HAVING SUM(s.arch IN ('arm64', 'arm64e')) = 0 AND SUM(s.arch = 'x86_64') > 0)) i
    UNION ALL
    SELECT 'apps.unsigned-applications' AS check_id, 'Application Information' AS category, 'Unsigned Applications' AS test,
      CASE WHEN u.n = 0 THEN 'PASS' ELSE 'FAIL' END AS result,
      CASE WHEN u.n = 0 THEN 'No unsigned applications found' ELSE u.apps END AS value
    FROM (SELECT COUNT(*) AS n, GROUP_CONCAT(path, ', ') AS apps FROM (
            SELECT a.path FROM apps a
            CROSS JOIN signature s ON s.path = a.path AND s.hash_resources = 0 AND s.hash_executable = 0
            WHERE a.path LIKE '/Applications/%'
            GROUP BY a.path HAVING MAX(s.signed) = 0)) u
    UNION ALL
    SELECT 'apps.background-agents' AS check_id, 'Application Information' AS category, 'Background Agents' AS test,
      'INFO' AS result,
      COALESCE((SELECT COUNT(*) || ': ' || GROUP_CONCAT(DISTINCT name) FROM startup_items
                WHERE type = 'agent' AND path NOT LIKE '/System/%' HAVING COUNT(*) > 0), 'none') AS value
    UNION ALL
    SELECT 'apps.background-daemons' AS check_id, 'Application Information' AS category, 'Background Daemons' AS test,
      'INFO' AS result,
      COALESCE((SELECT COUNT(*) || ': ' || GROUP_CONCAT(DISTINCT name) FROM startup_items
                WHERE type = 'daemon' AND path NOT LIKE '/System/%' HAVING COUNT(*) > 0), 'none') AS value
    UNION ALL
    SELECT 'apps.login-items' AS check_id, 'Application Information' AS category, 'Login Items' AS test,
      'INFO' AS result,
      COALESCE((SELECT COUNT(*) || ': ' || GROUP_CONCAT(DISTINCT name) FROM startup_items
                WHERE type NOT IN ('agent', 'daemon') HAVING COUNT(*) > 0), 'none') AS value
    UNION ALL
    SELECT 'apps.installed-system-extensions' AS check_id, 'Application Information' AS category, 'Installed System Extensions' AS test,
      'INFO' AS result,
      COALESCE((SELECT GROUP_CONCAT(identifier || ' (' || state || ')', ', ') FROM system_extensions), 'none') AS value;

