        ELSE 'managed: allowUSBRestrictedMode = ' || mp.v
      END AS value
    FROM (SELECT COUNT(DISTINCT value) AS n, MAX(value) AS v, GROUP_CONCAT(DISTINCT value) AS vals
          FROM managed_policies WHERE domain IN ('com.apple.applicationaccess') AND name = 'allowUSBRestrictedMode' AND username = '') mp
    UNION ALL
    SELECT 'management.rapid-security-response-installation-status' AS check_id, 'Management' AS category, 'Rapid Security Response Installation Status' AS test,
      CASE
