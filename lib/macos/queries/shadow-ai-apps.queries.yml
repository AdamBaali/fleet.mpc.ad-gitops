- name: Shadow AI - installed apps (macOS)
  query: |
    SELECT
      name,
      bundle_identifier,
      version,
      path
    FROM apps
    WHERE bundle_identifier IN (
      'com.anthropic.claudefordesktop',
      'com.openai.chat',
      'com.electron.ollama',
      'com.exafunction.windsurf',
      'com.todesktop.230313mzl4w4u92',
      'com.microsoft.Copilot',
      'ai.lmstudio.app',
      'ai.perplexity.mac',
      'ai.jan.app',
      'com.pieces.pfd',
      'com.amazon.q',
      'com.google.Gemini'
    )
    OR name IN (
      'Claude',
      'ChatGPT',
      'Cursor',
      'Windsurf',
      'LM Studio',
      'Ollama',
      'Perplexity',
      'Jan',
      'PiecesOS',
      'Pieces for Developers',
      'Gemini',
      'Microsoft Copilot',
      'Amazon Q'
    )
    ORDER BY name;
  description: |
    Installed AI desktop apps on this host.

    Matches on bundle identifier first (precise), then display name (catches
    renamed or repackaged builds). Bundle IDs are checked for:

      com.anthropic.claudefordesktop      Claude (Anthropic)
      com.openai.chat                    ChatGPT (OpenAI)
      com.todesktop.230313mzl4w4u92      Cursor AI code editor
      com.exafunction.windsurf           Windsurf AI code editor (Codeium/Exafunction)
      com.electron.ollama                Ollama menu bar app
      ai.lmstudio.app                    LM Studio (local LLM runner)
      ai.perplexity.mac                  Perplexity
      com.google.Gemini                  Google Gemini
      com.microsoft.Copilot              Microsoft Copilot
      ai.jan.app                         Jan (local LLM runner)
      com.pieces.pfd                     Pieces for Developers
      com.amazon.q                       Amazon Q

    No rows means none of these apps are installed.
    Pair with shadow-ai-cli-tools and shadow-ai-vscode-extensions for complete coverage.
  platform: macos

- name: Shadow AI - CLI tools on disk (macOS)
  query: |
    SELECT path, size, mtime
    FROM file
    WHERE path IN (
      '/usr/local/bin/ollama',
      '/usr/bin/ollama',
      '/opt/homebrew/bin/ollama',
      '/usr/local/bin/aider',
      '/opt/homebrew/bin/aider',
      '/usr/local/bin/fabric',
      '/opt/homebrew/bin/fabric',
      '/usr/local/bin/sgpt',
      '/opt/homebrew/bin/sgpt',
      '/usr/local/bin/lms'
    )
    ORDER BY path;
  description: |
    AI tool CLI binaries present on disk (macOS).

    Checks common install locations for:

      ollama     Local LLM runner daemon (separate from the menu bar app)
      aider      AI pair-programming CLI (pip install aider-chat)
      fabric     AI augmentation framework (danielmiessler/fabric)
      sgpt       shell-gpt, ChatGPT in the terminal
      lms        LM Studio CLI companion

    Homebrew, /usr/local, and pip-installed binaries are covered.
    A row means the binary exists regardless of whether it is currently running.
  platform: macos

- name: Shadow AI - running processes (macOS)
  query: |
    SELECT
      pid,
      name,
      path,
      cmdline,
      uid
    FROM processes
    WHERE name IN ('ollama', 'ollama_llama_server', 'aider', 'sgpt', 'fabric', 'lms')
      OR name LIKE '%Cursor%'
      OR name LIKE '%ChatGPT%'
      OR name LIKE '%Claude%'
      OR name LIKE '%Windsurf%'
      OR name LIKE 'LM Studio%'
      OR name LIKE '%Jan %'
      OR name LIKE '%Perplexity%'
      OR name LIKE '%Amazon Q%'
    ORDER BY name, pid;
  description: |
    AI apps and daemons currently running on this host (macOS).

    Catches running instances of AI desktop apps (including Electron helper
    processes) and background daemons such as the Ollama inference server.

    Name patterns used:
      Exact:   ollama, ollama_llama_server, aider, sgpt, fabric, lms
      Prefix:  LM Studio*, Jan *
      Partial: *Cursor*, *ChatGPT*, *Claude*, *Windsurf*, *Perplexity*, *Amazon Q*

    No rows means none of these processes are active right now. An installed app
    that has not been launched since last boot will not appear here.
  platform: macos

- name: Shadow AI - Homebrew AI packages (macOS)
  query: |
    SELECT
      name,
      version,
      path
    FROM homebrew_packages
    WHERE name IN (
      'ollama',
      'chatgpt',
      'lm-studio',
      'aider',
      'fabric',
      'sgpt',
      'jan',
      'claude-code'
    )
    ORDER BY name;
  description: |
    AI tools installed via Homebrew on this host.

    Covers both formulae (CLI tools) and casks (GUI apps) in a single query.
    Detected packages:
      ollama        Local LLM daemon (formula)
      chatgpt       ChatGPT desktop (cask)
      lm-studio     LM Studio (cask)
      aider         AI pair-programming CLI (formula)
      fabric        AI augmentation framework (formula)
      sgpt          shell-gpt (formula)
      jan           Jan local LLM runner (cask)
      claude-code   Claude Code CLI (formula)

    Homebrew installs update independently of App Store and may not appear in
    the apps table if the cask installs to a non-standard path.
  platform: macos

- name: Shadow AI - npm CLI tools (all platforms)
  query: |
    SELECT
      name,
      version,
      path,
      directory
    FROM npm_packages
    WHERE name IN (
      '@google/gemini-cli',
      '@anthropic-ai/claude-code',
      '@github/copilot',
      'openai',
      'anthropic'
    )
    OR name LIKE '%copilot%'
    OR name LIKE '%gemini-cli%'
    OR name LIKE '%langchain%'
    ORDER BY name;
  description: |
    AI tools installed as global npm packages on this host.

    Covers CLI tools and SDKs installed via npm or npx:
      @google/gemini-cli           Google Gemini CLI (binary: gemini, config: ~/.gemini/)
      @anthropic-ai/claude-code    Claude Code CLI (binary: claude, config: ~/.claude/)
      @github/copilot              GitHub Copilot CLI extension
      openai                       OpenAI Node.js SDK (indicates AI development)
      anthropic                    Anthropic Node.js SDK

    Works on macOS, Linux, and Windows.
  platform:
