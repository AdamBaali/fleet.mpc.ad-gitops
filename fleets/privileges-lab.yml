# Lab fleet for testing SAP Privileges as IT-approved temporary admin on macOS.
# When IT support adds a Mac to the label, the user sees Privileges in self-service and
# the Mac gets the profile that allows 20 minutes of admin rights. Other Macs get the
# locked profile, which also covers a Mac that leaves the label with Privileges installed.
# Kept apart from Temp Admin Lab so the script and Privileges never run on one Mac.
name: "Privileges Lab"
labels:
  # An empty hosts list removes every host on each GitOps run. Run GitOps on a daily
  # schedule (for example 6am) and approvals end each morning. IT support adds hosts
  # during the day through the API, or in the UI when GitOps mode is off.
  - name: "Privileges approved"
    description: "Macs whose user may take admin rights for 20 minutes with SAP Privileges. IT support adds and removes hosts."
    label_membership_type: manual
    hosts: []
policies:
reports:
agent_options:
controls:
  apple_settings:
    configuration_profiles:
      - path: ../lib/macos/configuration-profiles/privileges-base.mobileconfig
      # Exactly one of these two reaches each Mac. Two profiles that set Privileges keys
      # on one Mac would conflict.
      - path: ../lib/macos/configuration-profiles/privileges-locked.mobileconfig
        labels_exclude_any:
          - "Privileges approved"
      - path: ../lib/macos/configuration-profiles/privileges-temp-20min.mobileconfig
        labels_include_any:
          - "Privileges approved"
software:
  fleet_maintained_apps:
    - slug: privileges/darwin
      # Only approved Macs see Privileges in self-service. Fleet doesn't uninstall it
      # when a Mac leaves the label, so the locked profile above keeps it from granting
      # admin until IT support approves the Mac again.
      self_service: true
      labels_include_any:
        - "Privileges approved"
settings:
