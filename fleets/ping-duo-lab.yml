# Lab fleet for testing the PingFederate and Duo conditional access guides
# (fleetdm/fleet#54654). Critical policies and the MachineGuid report live here
# so they never touch other fleets.
name: "Ping Duo Lab"
policies:
  - path: ../lib/all/policies/ca-test.policies.yml
  - path: ../lib/macos/policies/duo-desktop-installed.policies.yml
  - path: ../lib/macos/policies/firefox-installed.policies.yml
  - path: ../lib/linux/policies/duo-desktop-installed.policies.yml
  - path: ../lib/windows/policies/duo-desktop-installed.policies.yml
reports:
  - path: ../lib/windows/reports/windows-machine-guid.reports.yml
  # The lab Mac shares the home Wi-Fi and is the control for the Home Wi-Fi reports.
  - path: ../lib/macos/reports/home-wifi.reports.yml
agent_options:
controls:
  apple_settings:
    configuration_profiles:
      # The SCEP user certificate profiles left with LAB_CA when testing finished.
      - path: ../lib/macos/configuration-profiles/lab-ca-root-trust.mobileconfig
      - path: ../lib/macos/configuration-profiles/lab-chrome-autoselect.mobileconfig
  windows_settings:
    configuration_profiles:
      - path: ../lib/windows/configuration-profiles/lab-ca-root-trust.xml
  # The lab Mac shares the home Wi-Fi, so it collects the same network logs as Home devices.
  scripts:
    - path: ../lib/macos/scripts/network-unified-logs.sh
    # fleetd health check, run on demand on the lab Mac (testing/fleetd-healthcheck-59727). Remove when that test ends.
    - path: ../lib/macos/scripts/fleetd-healthcheck.sh
    - path: ../lib/macos/scripts/fleetd-healthcheck-main.sh
software:
  fleet_maintained_apps:
    - slug: duo-desktop/darwin
    - slug: duo-desktop/windows
    - slug: firefox/darwin
  packages:
    - path: ../lib/linux/software/duo-desktop.yml
settings:
  secrets:
    - secret: "$FLEET_PING_DUO_LAB_ENROLL_SECRET"
