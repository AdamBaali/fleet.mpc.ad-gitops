# Lab fleet for testing software installs and scripts on a sleeping Mac laptop
# (fleetdm/fleet#46924). Nothing else lives here so it never touches other fleets.
name: "Power Nap Lab"
policies:
  - path: ../lib/macos/policies/power-nap-test.policies.yml
reports:
agent_options:
controls:
  # A policy's run_script only works on a script listed here.
  scripts:
    - path: ../lib/macos/scripts/power-nap-timestamps.sh
software:
  fleet_maintained_apps:
    - slug: google-chrome/darwin
    - slug: swiftdialog/darwin
settings:
  secrets:
    - secret: "$FLEET_POWER_NAP_LAB_ENROLL_SECRET"
