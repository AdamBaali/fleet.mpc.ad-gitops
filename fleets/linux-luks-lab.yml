# Lab fleet for testing Linux LUKS key escrow and key slot behavior
# (fleetdm/fleet#54871). Nothing else lives here so it never touches other fleets.
name: "Linux LUKS Lab"
policies:
reports:
agent_options:
controls:
  linux_settings:
    enable_escrow_disk_encryption_key: true
software:
settings:
  secrets:
    - secret: "$FLEET_LINUX_LUKS_LAB_ENROLL_SECRET"
