# Lab fleet for Android PIN at enrollment, option 3 target (fleetdm/fleet#57607, customer-antonella).
# Hosts arrive by transfer from "android-pin-staging" after setup, so the block applies to a host that already
# reached the home screen. The enroll secret is here so the fleet matches the others. Tests don't enroll with it.
name: "android-pin-enforced"
policies:
reports:
agent_options:
controls:
  android_settings:
    configuration_profiles:
      - path: ../lib/android/configuration-profiles/pin-block-0.json
software:
settings:
  secrets:
    - secret: "$FLEET_ANDROID_PIN_ENFORCED_ENROLL_SECRET"
