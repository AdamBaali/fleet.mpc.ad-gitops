# Lab fleet for testing temporary admin rights on macOS.
# IT support approves a Mac by running temp-admin-approve.sh from its page, the same as
# adding it to a static group. The user then sees "Admin rights for 20 minutes" in
# Fleet Desktop self-service and runs it once. The grant uses up the approval, so the item
# disappears again with nothing for IT support to remove.
name: "Temp Admin Lab"
labels:
  # Matches Macs with an unused approval, from the file temp-admin-approve.sh writes and
  # temp-admin.sh deletes. Both scripts ask Fleet to refetch the host, so the label updates
  # within minutes, not at the hourly refresh.
  - name: "Temp admin approved"
    description: "Macs IT support approved for one temporary admin grant. Shows the self-service item."
    label_membership_type: dynamic
    platform: darwin
    query: >-
      SELECT 1 FROM file
      WHERE path = '/Library/Application Support/Fleet/temp-admin-approved';
policies:
reports:
agent_options:
controls:
  scripts:
    - path: ../lib/macos/scripts/temp-admin-approve.sh
software:
  packages:
    - path: ../lib/macos/scripts/temp-admin.sh
      display_name: "Admin rights for 20 minutes"
      self_service: true
      categories:
        - "🛟 Support"
      labels_include_any:
        - "Temp admin approved"
settings:
