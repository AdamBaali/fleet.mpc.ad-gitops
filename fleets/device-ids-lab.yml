# Lab fleet for reporting Intune and Entra device IDs on Windows hosts (fleetdm/fleet#44916).
# Agent-only, like the customer. Nothing else lives here so the 10-minute reports never touch other fleets.
name: "Device IDs Lab"
policies:
reports:
  - path: ../lib/windows/reports/device-ids.reports.yml
agent_options:
controls:
  # fleetd health check scripts, run on demand through the API (testing/fleetd-healthcheck-59727).
  # The -main copy is the published version, kept as the negative control. Remove both when that test ends.
  scripts:
    - path: ../lib/windows/scripts/fleetd-healthcheck.ps1
    - path: ../lib/windows/scripts/fleetd-healthcheck-main.ps1
    # Run on a Docker Ubuntu host enrolled here for this test only.
    - path: ../lib/linux/scripts/fleetd-healthcheck.sh
software:
settings:
  secrets:
    - secret: "$FLEET_DEVICE_IDS_LAB_ENROLL_SECRET"
