# default.yml controls global settings and policies/reports that run on all hosts ("All fleets").

policies:
reports:
agent_options:
controls:
  windows_enabled_and_configured: true
org_settings:
  # No certificate_authorities: the #54654 lab CA (LAB_CA) is retired. GitOps deletes CAs that are not listed.
  server_settings:
    server_url: $FLEET_URL
    # The ServiceNow ITAM reports (fleetdm/fleet#38864) return one row per app or package,
    # and a Fedora Workstation host alone has about 2000 packages, over the default 1000. Remove with that lab.
    report_cap: 10000
  org_info:
    org_name: Fleet
  # Mock IdP for end user authentication, used only by fleets that turn it on (Windows Reset Lab, fleetdm/fleet#55003).
  # It runs on the Mac (testing/ppkg-wipe-55003/idp/), so the metadata is inline: Fleet can't fetch a URL on the Mac.
  # Test VMs reach it as idp.ppkg.test (a hosts file entry pointing at the Mac).
  # The certificate is public. The signing key stays in that project's private/ folder.
  mdm:
    end_user_authentication:
      idp_name: Lab IdP
      entity_id: fleet-mpc-ad-end-users
      metadata: |
        <?xml version="1.0"?>
        <md:EntityDescriptor xmlns:md="urn:oasis:names:tc:SAML:2.0:metadata" xmlns:ds="http://www.w3.org/2000/09/xmldsig#" entityID="http://idp.ppkg.test:9080/simplesaml/saml2/idp/metadata.php">
          <md:IDPSSODescriptor protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol">
            <md:KeyDescriptor use="signing">
              <ds:KeyInfo xmlns:ds="http://www.w3.org/2000/09/xmldsig#">
                <ds:X509Data>
                  <ds:X509Certificate></ds:X509Certificate>
                </ds:X509Data>
              </ds:KeyInfo>
            </md:KeyDescriptor>
            <md:KeyDescriptor use="encryption">
              <ds:KeyInfo xmlns:ds="http://www.w3.org/2000/09/xmldsig#">
                <ds:X509Data>
                  <ds:X509Certificate></ds:X509Certificate>
                </ds:X509Data>
              </ds:KeyInfo>
            </md:KeyDescriptor>
            <md:SingleLogoutService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="http://idp.ppkg.test:9080/simplesaml/saml2/idp/SingleLogoutService.php"/>
            <md:NameIDFormat>urn:oasis:names:tc:SAML:2.0:nameid-format:transient</md:NameIDFormat>
            <md:SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="http://idp.ppkg.test:9080/simplesaml/saml2/idp/SSOService.php"/>
          </md:IDPSSODescriptor>
        </md:EntityDescriptor>
  secrets:
    - secret: "$FLEET_GLOBAL_ENROLL_SECRET"
